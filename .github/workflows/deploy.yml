name: Deploy to Amazon EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4 # Actualizado a v4 para quitar el aviso amarillo

      - name: Desplegar en EC2 vía SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Forzamos entrar a la carpeta correcta (ajusta el nombre si es necesario)
            cd ~/Evaluacion-parcial-2 || cd ~/evaluacion-parcial-2
            
            # Detenemos lo anterior y limpiamos para evitar conflictos de permisos
            sudo docker-compose down
            
            # Levantamos de nuevo
            sudo docker-compose up --build -d